<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome للأيقونات -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
      }

      /* محتوى تجريبي */
      .content {
        padding: 40px 20px;
        text-align: center;
      }

      .content h1 {
        color: #b71922;
      }

      /* الخلفية السوداء عند فتح القائمة */

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(1px);
        opacity: 0;
        visibility: hidden;
        transition: 0.4s;
        z-index: 50;
      }

      .overlay.active {
        opacity: 1;
        visibility: visible;
      }

      /* منطقة القائمة الدائرية */

      .radial-menu {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 420px;
        max-width: 100vw;
        pointer-events: none;
        z-index: 100;
      }

      /* العناصر */

      .menu-item {
        position: absolute;
        bottom: 85px;
        left: 50%;

        width: 90px;
        height: 90px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-align: center;
        color: #b71922;

        opacity: 0;

        transform: translate(-50%, 80px) scale(0.4);

        transition:
          transform 0.55s cubic-bezier(0.17, 0.67, 0.36, 1.4),
          opacity 0.3s;

        pointer-events: none;
      }

      .menu-item i {
        font-size: 38px;
        margin-bottom: 8px;
      }

      .menu-item span {
        font-size: 14px;
        color: #333;
        white-space: nowrap;
      }

      /* عند فتح القائمة */

      .radial-menu.active {
        pointer-events: auto;
      }

      .radial-menu.active .menu-item {
        opacity: 1;
        pointer-events: auto;
      }

      /* توزيع العناصر بشكل مروحة */

      .radial-menu.active .item1 {
        transform: translate(-250px, -90px) scale(1);
        transition-delay: 0.05s;
      }

      .radial-menu.active .item2 {
        transform: translate(-145px, -190px) scale(1);
        transition-delay: 0.1s;
      }

      .radial-menu.active .item3 {
        transform: translate(-50px, -230px) scale(1);
        transition-delay: 0.15s;
      }

      .radial-menu.active .item4 {
        transform: translate(60px, -190px) scale(1);
        transition-delay: 0.2s;
      }

      .radial-menu.active .item5 {
        transform: translate(165px, -90px) scale(1);
        transition-delay: 0.25s;
      }

      /* الشريط السفلي */

      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 85px;

        background: white;

        display: flex;
        justify-content: space-around;
        align-items: center;

        box-shadow: 0 -2px 15px rgba(0, 0, 0, 0.08);

        z-index: 200;
      }

      /* عناصر النافبار */

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;

        color: #555;
        font-size: 13px;
      }

      .nav-item i {
        font-size: 25px;
      }

      /* الزر الرئيسي */

      .menu-button {
        position: absolute;

        left: 50%;
        top: -38px;

        transform: translateX(-50%);

        width: 78px;
        height: 78px;

        border: none;
        border-radius: 50%;

        background: #c81924;
        color: white;

        font-size: 30px;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        box-shadow: 0 8px 20px rgba(200, 25, 36, 0.4);

        transition: 0.4s;
      }

      /* حركة الزر عند الفتح */

      .menu-button.active {
        transform: translateX(-50%) rotate(45deg);
        background: #9f111a;
      }

      /* موبايل */

      @media (max-width: 600px) {
        .radial-menu {
          width: 100%;
          height: 380px;
        }

        .menu-item {
          width: 70px;
          height: 70px;
        }

        .menu-item i {
          font-size: 30px;
        }

        .menu-item span {
          font-size: 11px;
        }

        .radial-menu.active .item1 {
          transform: translate(-150px, -80px) scale(1);
        }

        .radial-menu.active .item2 {
          transform: translate(-90px, -170px) scale(1);
        }

        .radial-menu.active .item3 {
          transform: translate(-50%, -210px) scale(1);
        }

        .radial-menu.active .item4 {
          transform: translate(20px, -170px) scale(1);
        }

        .radial-menu.active .item5 {
          transform: translate(80px, -80px) scale(1);
        }
      }
    </style>
  </head>

  <body>
    <div class="content">
      <h1>محتوى الموقع</h1>
      <p>اضغط على الزر الأحمر بالأسفل</p>
    </div>

    <!-- الخلفية -->
    <div class="overlay" id="overlay"></div>

    <!-- القائمة المتفرعة -->

    <div class="radial-menu" id="radialMenu">
      <div class="menu-item item1">
        <i class="fa-solid fa-percent"></i>
        <span>العروض</span>
      </div>

      <div class="menu-item item2">
        <i class="fa-solid fa-comments"></i>
        <span>الباقات</span>
      </div>

      <div class="menu-item item3">
        <i class="fa-solid fa-gear"></i>
        <span>الخدمات التقنية</span>
      </div>

      <div class="menu-item item4">
        <i class="fa-solid fa-headset"></i>
        <span>خدمة الزبائن</span>
      </div>

      <div class="menu-item item5">
        <i class="fa-solid fa-circle-info"></i>
        <span>حول الموقع</span>
      </div>
    </div>

    <!-- النافبار السفلي -->

    <div class="bottom-nav">
      <div class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>الرئيسية</span>
      </div>

      <div class="nav-item">
        <i class="fa-solid fa-headset"></i>
        <span>خدمة الزبائن</span>
      </div>

      <!-- الزر الرئيسي -->

      <button class="menu-button" id="menuButton">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="nav-item">
        <i class="fa-regular fa-newspaper"></i>
        <span>جديدنا</span>
      </div>

      <div class="nav-item">
        <i class="fa-solid fa-money-bill-transfer"></i>
        <span>سيرتل كاش</span>
      </div>
    </div>

    <script>
      const menuButton = document.getElementById("menuButton");
      const radialMenu = document.getElementById("radialMenu");
      const overlay = document.getElementById("overlay");

      menuButton.addEventListener("click", function () {
        radialMenu.classList.toggle("active");
        overlay.classList.toggle("active");
        menuButton.classList.toggle("active");
      });

      overlay.addEventListener("click", function () {
        radialMenu.classList.remove("active");
        overlay.classList.remove("active");
        menuButton.classList.remove("active");
      });
    </script>
  </body>
</html>
